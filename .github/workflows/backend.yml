name: Backend CI
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Fix eslint permissions
        working-directory: backend
        run: chmod +x node_modules/.bin/eslint
      - name: Run lint
        working-directory: backend
        run: ./node_modules/.bin/eslint . --ext .ts
      - name: Run tests
        working-directory: backend
        run: npm test
      - name: Build backend
        working-directory: backend
        run: npm run build
